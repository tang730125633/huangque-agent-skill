<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Huangque install map</title>
  <desc id="desc">Warm paper install matrix showing one use-huangque-cli Skill distributed to DeepSeek Harness, Codex, OpenClaw, Pi Agent, and MCP.</desc>
  <rect width="1200" height="360" fill="#e7e1d3"/>
  <path d="M58 74H1142M58 286H1142" stroke="#171612" stroke-opacity=".32"/>
  <g transform="translate(58 48)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">
    <circle cx="4" cy="-5" r="4" fill="#d65336"/>
    <text x="20" y="0" fill="#6e6a61">INSTALL TARGETS</text>
  </g>

  <g stroke="#d65336" stroke-width="2.5" stroke-linecap="square">
    <path d="M600 156H512"/>
    <path d="M770 156H856"/>
    <path d="M686 190V248"/>
  </g>

  <text x="58" y="140" fill="#171612" font-size="54" font-weight="650" font-family="Iowan Old Style, Baskerville, Songti SC, STSong, Georgia, serif">一份 Skill，五个入口</text>
  <text x="60" y="178" fill="#6e6a61" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">四端与 MCP 共用同一份 SKILL.md。</text>

  <g transform="translate(600 102)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="-18" y="-18" width="206" height="124" fill="#f1eee4" stroke="#171612" stroke-opacity=".28"/>
    <rect width="170" height="88" fill="#fffdfa" stroke="#171612"/>
    <text x="26" y="39" fill="#171612" font-size="22" font-weight="800">SKILL.md</text>
    <text x="26" y="65" fill="#6e6a61" font-size="16">canonical file</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18">
    <g transform="translate(58 220)">
      <rect width="172" height="62" fill="#fffdfa" stroke="#171612"/>
      <text x="18" y="26" fill="#171612" font-weight="800">DeepSeek</text>
      <text x="18" y="48" fill="#6e6a61" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.dsh/skills</text>
    </g>
    <g transform="translate(250 220)">
      <rect width="172" height="62" fill="#fffdfa" stroke="#171612"/>
      <text x="18" y="26" fill="#171612" font-weight="800">Codex</text>
      <text x="18" y="48" fill="#6e6a61" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.codex/skills</text>
    </g>
    <g transform="translate(442 220)">
      <rect width="172" height="62" fill="#fffdfa" stroke="#171612"/>
      <text x="18" y="26" fill="#171612" font-weight="800">OpenClaw</text>
      <text x="18" y="48" fill="#6e6a61" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.openclaw</text>
    </g>
    <g transform="translate(634 220)">
      <rect width="172" height="62" fill="#fffdfa" stroke="#171612"/>
      <text x="18" y="26" fill="#171612" font-weight="800">Pi Agent</text>
      <text x="18" y="48" fill="#6e6a61" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/.pi/agent</text>
    </g>
    <g transform="translate(826 220)">
      <rect width="172" height="62" fill="#171612" stroke="#171612"/>
      <text x="18" y="26" fill="#f1eee4" font-weight="800">MCP</text>
      <text x="18" y="48" fill="#e7e1d3" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hq mcp</text>
    </g>
  </g>
  <text x="1046" y="266" fill="#d65336" font-size="42" font-weight="650" font-family="Iowan Old Style, Baskerville, Songti SC, STSong, Georgia, serif">HQ</text>
</svg>
