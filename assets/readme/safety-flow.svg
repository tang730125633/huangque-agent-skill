<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Huangque safe run pipeline</title>
  <desc id="desc">Editorial paper diagram showing six safety steps: pin CLI, check account, discover live capability, quote, confirm once, and verify the task.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#171612" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="#f1eee4"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <path d="M58 82H1142" stroke="#171612"/>
  <path d="M58 352H1142" stroke="#171612" stroke-opacity=".28"/>

  <g transform="translate(58 52)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">
    <circle cx="4" cy="-5" r="4" fill="#d65336"/>
    <text x="20" y="0" fill="#6e6a61">SAFE RUN PIPELINE</text>
  </g>
  <text x="58" y="142" fill="#171612" font-size="56" font-weight="650" font-family="Iowan Old Style, Baskerville, Songti SC, STSong, Georgia, serif">先读合同，再动手</text>
  <text x="60" y="180" fill="#6e6a61" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">读、报价、确认、验收分开；未知状态只查原任务，不重建付费作业。</text>

  <g transform="translate(58 230)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <path d="M42 46H1038" stroke="#171612" stroke-opacity=".36"/>
    <g transform="translate(0 0)">
      <rect width="146" height="92" fill="#fffdfa" stroke="#171612"/>
      <text x="18" y="30" fill="#d65336" font-size="15" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
      <text x="18" y="62" fill="#171612" font-size="22" font-weight="800">固定 CLI</text>
    </g>
    <g transform="translate(186 0)">
      <rect width="146" height="92" fill="#e7e1d3" stroke="#171612"/>
      <text x="18" y="30" fill="#d65336" font-size="15" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
      <text x="18" y="62" fill="#171612" font-size="22" font-weight="800">查账号</text>
    </g>
    <g transform="translate(372 0)">
      <rect width="146" height="92" fill="#fffdfa" stroke="#171612"/>
      <text x="18" y="30" fill="#d65336" font-size="15" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
      <text x="18" y="62" fill="#171612" font-size="22" font-weight="800">发现能力</text>
    </g>
    <g transform="translate(558 0)">
      <rect width="146" height="92" fill="#ead0c4" stroke="#171612"/>
      <text x="18" y="30" fill="#d65336" font-size="15" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text>
      <text x="18" y="62" fill="#171612" font-size="22" font-weight="800">先报价</text>
    </g>
    <g transform="translate(744 0)">
      <rect width="146" height="92" fill="#fffdfa" stroke="#171612"/>
      <text x="18" y="30" fill="#d65336" font-size="15" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05</text>
      <text x="18" y="62" fill="#171612" font-size="22" font-weight="800">确认一次</text>
    </g>
    <g transform="translate(930 0)">
      <rect width="146" height="92" fill="#171612" stroke="#171612"/>
      <text x="18" y="30" fill="#d65336" font-size="15" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">06</text>
      <text x="18" y="62" fill="#f1eee4" font-size="22" font-weight="800">验收任务</text>
    </g>
  </g>

  <text x="58" y="379" fill="#171612" font-size="18" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hq capabilities → hq describe → quote_token → job_id</text>
</svg>
